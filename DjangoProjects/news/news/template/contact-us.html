<!DOCTYPE html>
<html lang="">

<head>
    {% load static %}

  <meta charset="utf-8">
  <title>Retnews &#8211; Best news, blog & magazine template</title>
  <meta name="description" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="manifest" href="site.webmanifest">
  <!-- favicon.ico in the root directory -->
  <link rel="apple-touch-icon" href="{% static 'icon.png' %}">

  <meta name="theme-color" content="#030303">
  <!-- google fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,500;0,700;1,300;1,500&family=Poppins:ital,wght@0,300;0,500;0,700;1,300;1,400&display=swap"
    rel="stylesheet">
  <link href="{% static '/css/styles.css' %}" rel="stylesheet">
</head>

<body>

  <!-- loading -->
  <div class="loading-container">
    <div class="h-100 d-flex align-items-center justify-content-center">
      <ul class="list-unstyled">
        <li>
          <img src="{% static 'images/loading.png' %}" alt="Alternate Text" height="100" />

        </li>
        <li>

          <div class="spinner">
            <div class="rect1"></div>
            <div class="rect2"></div>
            <div class="rect3"></div>
            <div class="rect4"></div>
            <div class="rect5"></div>

          </div>

        </li>
        <li>
          <p>Loading</p>
        </li>
      </ul>
    </div>
  </div>
  <!-- End loading -->

  <!-- 404 -->
  <main class="error-content d-flex h-100 align-items-center text-center">
    <div class="container">
      <h1>404</h1>
      <h2>Page Not Found</h2>

      <p class="lead">Sorry, but the page you were trying to view does not exist.</p>
      <a class='btn btn-primary' href='/homepage-v1'><i class="fa fa-home"></i> go to homepage</a>
    </div>
  </main>

  <script src="{% static '/js/index.bundle.js' %}"></script>
</body>

</html>
