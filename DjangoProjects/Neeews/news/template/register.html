<!DOCTYPE html>
<html dir="ltr" lang="en">

<head>
    {% load static %}
    {% load socialaccount %}
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UZNews - Registratsiya</title>
    <meta name="author" content="X & M">
    <meta name="description" content="UZNews - Yangiliklar va Maqolalar sayti">
    <meta name="keywords"
        content="news, newspaper, magazine, blog, post, article, editorial, publishing, modern, responsive, html5, template">
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:400,600,700">
    <link rel="stylesheet" href="{% static 'css/font-awesome.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/fontawesome-stars-o.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/responsive-style.css' %}">
    <link rel="stylesheet" href="{% static 'css/colors/theme-color-1.css' %}" id="changeColorScheme">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>

<body>
    <div id="preloader">
        <div class="preloader bg--color-1--b" data-preloader="1">
            <div class="preloader--inner"></div>
        </div>
    </div>
    <div class="wrapper">
        <div class="login--section pd--100-0 bg--overlay" data-bg-img="img/login-img/bg.jpg">
            <div class="container">
                <div class="login--form">
                    <div class="title">
                        <h1 class="h1">Register</h1>
                        <p>Create a new account by filling out the form below</p>
                    </div>
                    <form action="{% url 'register_user' %}" method="POST" data-form="validate">
                        {% csrf_token %}
                        <div class="form-group"> <label> <span>Username</span> <input type="text" name="username"
                                    class="form-control" required> </label> </div>
                        <div class="form-group"> <label> <span>Email Address</span> <input type="email" name="email"
                                    class="form-control" required> </label> </div>
                        <div class="form-group"> <label> <span>Password</span> <input type="password" name="password"
                                    class="form-control" required> </label> </div>
                        <div class="checkbox"> <label> <input type="checkbox" name="rememberme"> <span>Remember
                                    me</span> </label> </div>
                        <button type="submit" class="btn btn-lg btn-block btn-primary">Register</button>
                        <button type="button" class="btn btn-lg btn-block btn-secondary" onclick="window.location.href='{% url 'login' %}'">Already have an account? Log in</button>
                        <button type="button" class="btn btn-lg btn-block btn-danger" onclick="window.location.href='{% provider_login_url 'google' %}'">Google</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="{% static 'js/jquery-3.2.1.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
    <script src="{% static 'js/jquery.sticky.min.js' %}"></script>
    <script src="{% static 'js/jquery.hoverIntent.min.js' %}"></script>
    <script src="{% static 'js/jquery.marquee.min.js' %}"></script>
    <script src="{% static 'js/jquery.validate.min.js' %}"></script>
    <script src="{% static 'js/isotope.min.js' %}"></script>
    <script src="{% static 'js/resizesensor.min.js' %}"></script>
    <script src="{% static 'js/theia-sticky-sidebar.min.js' %}"></script>
    <script src="{% static 'js/jquery.zoom.min.js' %}"></script>
    <script src="{% static 'js/jquery.barrating.min.js' %}"></script>
    <script src="{% static 'js/jquery.countdown.min.js' %}"></script>
    <script src="{% static 'js/retina.min.js' %}"></script>
    <script src="{% static 'https://maps.googleapis.com/maps/api/js?key=AIzaSyBK9f7sXWmqQ1E-ufRXV3VpXOn_ifKsDuc' %}"></script>
    <script src="{% static 'js/color-switcher.min.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>

</html>
